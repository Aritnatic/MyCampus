<!-- MyCampus mark. 96-unit grid: a lowercase "m" of two equal arches (radius 13) on three legs (stroke 14,
     centres 22 / 48 / 74). The right arch stands 21 units higher than the left, so the "m" is also two campus
     buildings and a step up: a place, and students rising in it. Square ends, no ornament, one colour. -->
