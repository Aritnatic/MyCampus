  <path d="M22 87V61a13 13 0 0 1 26 0M48 87V40a13 13 0 0 1 26 0V87" transform="translate(0 -5.5)" fill="none" stroke="#7C3AED" stroke-width="14" stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
